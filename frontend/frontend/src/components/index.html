<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6c5ce7" />
    <meta name="description" content="EduLearn Pro - Advanced E-Learning Platform. Learn coding, design, business and more with expert instructors." />
    <meta name="keywords" content="online learning, courses, education, programming, design, business" />
    <meta name="author" content="EduLearn Pro Team" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="EduLearn Pro - Learn Without Limits" />
    <meta property="og:description" content="Join millions of learners worldwide. Master new skills with expert-led courses." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://edulearn-pro.com" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduLearn Pro - Learn Without Limits" />
    <meta name="twitter:description" content="Join millions of learners worldwide. Master new skills with expert-led courses." />
    <meta name="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- Title -->
    <title>EduLearn Pro - Learn Without Limits</title>
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "EduLearn Pro",
      "description": "Advanced E-Learning Platform for Professional Development",
      "url": "https://edulearn-pro.com",
      "logo": "https://edulearn-pro.com/logo.png",
      "sameAs": [
        "https://twitter.com/edulearn-pro",
        "https://linkedin.com/company/edulearn-pro"
      ]
    }
    </script>
  </head>
  <body>
    <!-- No JavaScript fallback -->
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run EduLearn Pro.</p>
        <p>Please enable JavaScript in your browser settings and refresh this page.</p>
      </div>
    </noscript>
    
    <!-- Main App Container -->
    <div id="root">
      <!-- Loading screen while React loads -->
      <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa; display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: Arial, sans-serif;">
        <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #6c5ce7; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 20px; color: #64748b;">Loading EduLearn Pro...</p>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    
    <!-- Analytics & Performance Monitoring -->
    <!-- Add your Google Analytics, GTM, or other tracking codes here -->
  </body>
